# Build, lint and test on Windows: pull requests into main only (a release from dev, or a hotfix),
# to spend Actions minutes once per release. Changes reach main only by pull request (its ruleset),
# so a push there was tested already, and a release tag's commit was tested on main. Work merged
# into dev is checked locally before it merges (CONTRIBUTING.md, "Before you open a pull request").
# A change to the website or the docs alone builds nothing here (the app embeds none of it; the
# Website workflow builds the site), nor does one to the upstream-sync tool (its own workflow).
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "tools/website/**"
      - "docs/**"
      - "**/*.md"
      - "tools/upstream-sync/**"
      - ".claude/**"
      - ".github/workflows/upstream-*.yml"

# A newer commit on a pull request makes its older run moot: cancel it (main and dev run to the end).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: windows-latest
    runs-on: windows-latest
    # A cold build takes about 10 minutes; a hung runner is cut off
    # instead of running to GitHub's 6 hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml picks stable with rustfmt and clippy.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  extension:
    name: browser extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Logic against fake Firefox and Chrome APIs
        run: node tools/extension/test.mjs

      # Chrome, Edge, Brave, Opera, Vivaldi (mdm-chromium.zip), Firefox (mdm-firefox.xpi) and
      # the Chrome Web Store's copy (mdm-chrome-store.zip).
      - name: Pack for every browser
        shell: pwsh
        run: ./tools/extension/pack.ps1

      - name: Check the packages
        run: node tools/extension/check-pack.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            target/extension/mdm-chromium.zip
            target/extension/mdm-firefox.xpi
            target/extension/mdm-chrome-store.zip
