# The quick checks, on Linux, for pull requests into main (a release from dev, or a hotfix): about
# a minute. The Windows build, clippy and tests run on the maintainer's computer before each
# pull request merges (CONTRIBUTING.md, "Before you open a pull request"), and the release is
# built and published from there too (tools/installer/publish.ps1), so no runner builds Rust.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "tools/website/**"
      - "docs/**"
      - "**/*.md"
      - "tools/upstream-sync/**"
      - ".claude/**"
      - ".github/workflows/upstream-*.yml"

# A newer commit on a pull request makes its older run moot: cancel it (main and dev run to the end).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  extension:
    name: browser extension
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Logic against fake Firefox and Chrome APIs
        run: node tools/extension/test.mjs

      # Plan 10: no "Mister Download Manager" or "MDM" back where the rename to Grabbit is
      # done (upstream's fixes still carry the old name).
      - name: The old name stays gone
        run: python3 tools/rename/check.py --done

      # Chrome, Edge, Brave, Opera, Vivaldi (mdm-chromium.zip), Firefox (mdm-firefox.xpi) and
      # the Chrome Web Store's copy (mdm-chrome-store.zip).
      - name: Pack for every browser
        shell: pwsh
        run: ./tools/extension/pack.ps1

      - name: Check the packages
        run: node tools/extension/check-pack.mjs
