# Builds misterdownloadmanager.com (tools/website/build.py: website/, docs/ and CHANGELOG.md, in
# English) and publishes it with GitHub Pages, on every push to main that touches them, or by
# hand (Actions → Website → Run workflow) to refresh the star, fork and issue counts and the
# contributors (tools/contributors.py). No daily run: Actions minutes are counted.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "Cargo.toml"
      - "tools/website/**"
      - "tools/contributors.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install markdown==3.10
          python tools/website/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
