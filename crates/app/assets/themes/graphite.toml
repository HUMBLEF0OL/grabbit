# Graphite: one of Mister Download Manager's built-in themes, its own new look (design/graphite):
# colours and shapes of our own design, light and dark (jet black, royal amethyst, electric
# cyan); it borrows nothing but its MIT-licensed Tabler icons (graphite/icons/SOURCES.txt) and
# its typeface, Geist (Vercel, SIL Open Font License 1.1), which MDM carries (assets/fonts/geist).
# It is also an example of a theme file: seeds for the colours, many roles set by hand (the
# outlaw colour on the default button and the progress bars), rounded corners, Windows 11's
# controls with a focus ring, taller list rows, a flat drawn title bar on Windows and an icon
# set in one colour.
# Written by design/graphite/source/make_theme.py from source/pal.py, palette "amethyst": edit
# the palette or the mapping there, not here.

name = "Graphite"
# A font MDM carries: Geist (Regular, Medium, SemiBold for the bold texts).
font = "geist"
icon-set = "graphite"

[controls]
field-focus = "ring"
focus = "ring"
check = "fluent"
button = "fluent"
progress = "line"
scroll = "overlay"
# A drawn, flat title bar coloured by the caption roles.
caption = "metro"

[sizes]
radius = 8
"radius.button" = 8
"radius.part" = 6
"radius.check" = 4
"radius.flyout" = 10
"radius.menu-item" = 6
"radius.popup" = 8
"radius.egui" = 8
# The mockup's row height, and its column heads' (7 above and below the title, the rule).
"list.row" = 32
"list.header" = 31
# Geist's sizes (plan 04, step 6): the main window's text and column heads at the mock's 12,
# its toolbar labels at 11.5 (`font.small`, plan 05b), egui's body text at 13.
"font.ui" = 12
"font.body" = 13
"font.small" = 11.5
"font.heading" = 16


[seeds.light]
background = "#f7f6fb"
surface = "#ffffff"
header = "#ffffff"
text = "#0d0b14"
accent = "#6527d4"
selection = "#f0e9fe"
error = "#c62828"
warning = "#9d5d00"
success = "#15803d"

[seeds.dark]
background = "#09080d"
surface = "#121019"
header = "#121019"
text = "#f0eef7"
accent = "#b08cff"
selection = "#231a3a"
error = "#ff7b7b"
warning = "#f5a524"
success = "#4ade80"

[light]
# Text.
"text.disabled" = "#a5a0b6"
"text.muted" = "#625d78"
link = "#6527d4"
"focus.ring" = "#6527d4a0"
# Selection.
"selection.text" = "#0d0b14"
"selection.inactive" = "#f3f1f9"
# Fields.
field = "#ffffff"
"field.border" = "#e3e0ec"
"field.bottom" = "#e3e0ec"
"field.disabled" = "#f2f0f8"
# Greyed controls: the one greyed colour, no fading.
"field.disabled.border" = "#f1eff7"
"button.disabled" = "#ffffff"
"button.disabled.border" = "#e3e0ec"
"check.on.disabled" = "#a5a0b6"
# Buttons: the default one outlined in the outlaw colour, an accent one filled with it.
button = "#ffffff"
"button.border" = "#e3e0ec"
"button.bottom" = "#e3e0ec"
"button.hot" = "#f3f1f9"
"button.pressed" = "#ebe8f3"
"button.text.pressed" = "#4b4760"
"button.default.border" = "#00788e"
"button.default.bottom" = "#00788e"
"button.accent" = "#00788e"
"button.accent.bottom" = "#00788e"
"button.accent.text" = "#ffffff"
"button.accent.hot" = "#00829a"
"button.accent.pressed" = "#00687c"
"button.accent.text.pressed" = "#ffffff"
# Check boxes and radios: the border kept under the pointer, fainter pressed.
"check.on" = "#6527d4"
"check.mark" = "#ffffff"
"check.border" = "#8a849f"
"check.border.hot" = "#8a849f"
"check.border.pressed" = "#ada9bc"
"check.border.disabled" = "#a5a0b6"
# Progress: the outlaw colour on the track.
"progress.track" = "#e4e1ed"
"meter.track" = "#e4e1ed"
"progress.bar" = "#00788e"
"meter.fill" = "#00788e"
"segments.done" = "#00788e"
"segments.missing" = "#e4e1ed"
"pieces.have" = "#00788e"
"pieces.partial" = "#8cc2cc"
"pieces.missing" = "#e4e1ed"
# Lists.
list = "#f7f6fb"
header = "#f7f6fb"
"header.line" = "#e3e0ec"
grid = "#f1eff7"
"list.grid" = "#f1eff7"
"chip.web" = "#f0e9fe"
"chip.text" = "#5317b8"
"chip.torrent" = "#f2f0f8"
# Menus.
menubar = "#ffffff"
"menubar.line" = "#e3e0ec"
menu = "#ffffff"
"menu.hot" = "#f0e9fe"
"menu.border" = "#e3e0ec"
"menu.text.disabled" = "#a5a0b6"
# Toolbar: a neutral face under the pointer, no border.
"toolbar.hot" = "#f3f1f9"
"toolbar.pressed" = "#ebe8f3"
"toolbar.hot.faint" = "#f9f8fc"
"toolbar.text.disabled" = "#a5a0b6"
"icon.disabled" = "#a5a0b6"
# Categories tree.
"tree.expander" = "#625d78"
# The drawn title bar: the panel colour, its buttons a tint of the ink (6 %, 12 %).
caption = "#ffffff"
"caption.text" = "#0d0b14"
"caption.text.inactive" = "#625d78"
"caption.hot" = "#0d0b140f"
"caption.pressed" = "#0d0b141f"
# The Graphite layout: panels, icon tiles, shortcuts, danger buttons, banners.
panel = "#ffffff"
tile = "#f2f0f8"
"text.secondary" = "#4b4760"
"menu.shortcut" = "#625d78"
"toolbar.checked" = "#f0e9fe"
"button.danger" = "#c62828"
"button.danger.text" = "#ffffff"
"banner.error" = "#fdeaea"
"banner.info" = "#f0e9fe"
"banner.warning" = "#fdf3e1"
# Two-tone finish and glow (09a): the outlaw colour's lighter stop, a glow in dark only.
glow = "#00000000"
"button.accent.top" = "#00829a"
"progress.bar.end" = "#00829a"

