# Graphite: one of Mister Download Manager's built-in themes, its own new look (design/graphite):
# colours and shapes of our own design, light and dark (Zinc greys, Emerald green for the
# accent); it borrows nothing but its MIT-licensed Tabler icons (graphite/icons/SOURCES.txt) and
# its typeface, Geist (Vercel, SIL Open Font License 1.1), which MDM carries (assets/fonts/geist).
# It is also an example of a theme file: seeds for the colours, many roles set by hand (the
# outlaw colour on the default button and the progress bars), rounded corners, Windows 11's
# controls with a focus ring, taller list rows, a flat drawn title bar on Windows and an icon
# set in one colour.
# Written by design/graphite/source/make_theme.py from source/pal.py, palette "graphite": edit
# the palette or the mapping there, not here.

name = "Graphite"
# A font MDM carries: Geist (Regular, Medium, SemiBold for the bold texts).
font = "geist"
icon-set = "graphite"

[controls]
field-focus = "ring"
focus = "ring"
check = "fluent"
button = "graphite"
progress = "graphite"
scroll = "overlay"
# A drawn, flat title bar coloured by the caption roles.
caption = "graphite"

[sizes]
# The mock's 8 on its 30-point controls, in proportion on MDM's 23-point ones.
radius = 6
"radius.button" = 8
"radius.part" = 6
"radius.check" = 4
"radius.flyout" = 10
"radius.menu-item" = 6
"radius.popup" = 8
"radius.egui" = 8
# The mockup's row height, and its column heads' (7 above and below the title, the rule).
"list.row" = 32
"list.header" = 31
# Geist's sizes (plan 04, step 6): the main window's text and column heads at the mock's 12,
# its toolbar labels at 11.5 (`font.small`, plan 05b), egui's body text at 13.
"font.ui" = 12
"font.body" = 13
"font.small" = 11.5
"font.heading" = 16


[seeds.light]
background = "#fafafa"
surface = "#ffffff"
header = "#ffffff"
text = "#18181b"
accent = "#0c704d"
selection = "#e6f2ec"
error = "#b42318"
warning = "#9d5d00"
success = "#0c704d"

[seeds.dark]
background = "#121214"
surface = "#18181b"
header = "#18181b"
text = "#f4f4f5"
accent = "#3ecf8e"
selection = "#15302a"
error = "#ff8b80"
warning = "#f5a524"
success = "#3ecf8e"

[light]
# Text.
"text.disabled" = "#a1a1aa"
"text.muted" = "#6b6b74"
link = "#0c704d"
"focus.ring" = "#0c704db0"
# Selection.
"selection.text" = "#18181b"
"selection.inactive" = "#f2f2f4"
# Fields.
field = "#ffffff"
"field.border" = "#e4e4e7"
"field.bottom" = "#e4e4e7"
"field.disabled" = "#f1f1f3"
# Greyed controls: the one greyed colour, no fading.
"field.disabled.border" = "#f0f0f2"
"button.disabled" = "#ffffff"
"button.disabled.border" = "#e4e4e7"
"check.on.disabled" = "#a1a1aa"
# Buttons: the default one outlined in the outlaw colour, an accent one filled with it.
button = "#ffffff"
"button.border" = "#e4e4e7"
"button.bottom" = "#e4e4e7"
"button.hot" = "#f2f2f4"
"button.pressed" = "#ebebee"
"button.text.pressed" = "#52525b"
"button.default.border" = "#0c704d"
"button.default.bottom" = "#0c704d"
"button.accent" = "#0c704d"
"button.accent.bottom" = "#0c704d"
"button.accent.text" = "#ffffff"
"button.accent.hot" = "#0c704d"
"button.accent.pressed" = "#0a5f41"
"button.accent.text.pressed" = "#ffffff"
# Check boxes and radios: the border kept under the pointer, fainter pressed.
"check.on" = "#0c704d"
"check.mark" = "#ffffff"
"check.border" = "#8a8a93"
"check.border.hot" = "#8a8a93"
"check.border.pressed" = "#adadb3"
"check.border.disabled" = "#a1a1aa"
# Progress: the outlaw colour on the track.
"progress.track" = "#e4e4e7"
"meter.track" = "#e4e4e7"
"progress.bar" = "#0c704d"
"meter.fill" = "#0c704d"
"segments.done" = "#0c704d"
"segments.missing" = "#e4e4e7"
"pieces.have" = "#0c704d"
"pieces.partial" = "#92bfaf"
"pieces.missing" = "#e4e4e7"
# Lists.
list = "#fafafa"
header = "#fafafa"
"header.line" = "#e4e4e7"
grid = "#f0f0f2"
"list.grid" = "#f0f0f2"
"chip.web" = "#e6f2ec"
"chip.text" = "#0a5c3f"
"chip.torrent" = "#f1f1f3"
# Menus.
menubar = "#ffffff"
"menubar.line" = "#e4e4e7"
menu = "#ffffff"
"menu.hot" = "#e6f2ec"
"menu.border" = "#e4e4e7"
"menu.text.disabled" = "#a1a1aa"
# Toolbar: a neutral face under the pointer, no border.
"toolbar.hot" = "#f2f2f4"
"toolbar.pressed" = "#ebebee"
"toolbar.hot.faint" = "#f8f8fa"
"toolbar.text.disabled" = "#a1a1aa"
"icon.disabled" = "#a1a1aa"
# Categories tree.
"tree.expander" = "#6b6b74"
# The drawn title bar: the panel colour, its buttons a tint of the ink (6 %, 12 %).
caption = "#ffffff"
"caption.text" = "#18181b"
"caption.text.inactive" = "#6b6b74"
"caption.hot" = "#18181b0f"
"caption.pressed" = "#18181b1f"
# The Graphite layout: panels, icon tiles, shortcuts, danger buttons, banners.
panel = "#ffffff"
tile = "#f1f1f3"
"text.secondary" = "#52525b"
"menu.shortcut" = "#6b6b74"
"toolbar.checked" = "#e6f2ec"
"button.danger" = "#b42318"
"button.danger.text" = "#ffffff"
"banner.error" = "#fdecea"
"banner.info" = "#e6f2ec"
"banner.warning" = "#fdf3e1"
# Two-tone finish (09a): the outlaw colour's lighter stop; no glow, in either mode (1.0.1).
glow = "#00000000"
"button.accent.top" = "#0c704d"
"progress.bar.end" = "#0c704d"

