[package]
name = "grabbit-torrent"
description = "BitTorrent and magnet downloads for Grabbit (librqbit, D-014)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# The code's paths stay `mdm_torrent::` (plan 10, decision 3).
[lib]
name = "mdm_torrent"

[dependencies]
# 9.1.0 and later: upstream's robustness fixes for what peers send.
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
# The result type of librqbit's storage trait (authorized_storage.rs).
anyhow.workspace = true
# The TLS setup of the session's HTTP clients (trackers, UPnP), MDM's own: a system without CA
# certificates still starts a session (mdm_engine::tls).
mdm-engine.workspace = true
flate2.workspace = true
# Reading librqbit's saved session (session.json) before it starts (lib.rs).
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
# A warning when the thread that reads the torrents' numbers can't start (watch.rs).
tracing.workspace = true
# The blocklist file's URL, and trackers' hosts (lib.rs, trackers.rs).
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The probe example's logs (RUST_LOG).
tracing-subscriber.workspace = true

[lints]
workspace = true